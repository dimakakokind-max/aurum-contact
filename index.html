<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURUM | Оставить заявку</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500;700&display=swap');

        :root {
            --bg-color: #030303;
            --text-main: #f0f0f0;
            --text-muted: #888;
            --accent: #d4af37;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; user-select: none; }
        html { scroll-behavior: smooth; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Курсор (для красоты) */
        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); }
        .cursor-hover .cursor-dot { width: 60px; height: 60px; background: rgba(212, 175, 55, 0.2); }

        /* Фон */
        .bg-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; filter: blur(120px); }
        .blob { position: absolute; border-radius: 50%; opacity: 0.4; animation: float 25s infinite ease-in-out alternate; }
        .blob-1 { width: 600px; height: 600px; background: #4a0e2e; top: -10%; left: -10%; }
        .blob-2 { width: 500px; height: 500px; background: #0e1a4a; bottom: -20%; right: -10%; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(80px, 50px) scale(1.1); } }

        /* Основной блок */
        .contact-wrapper {
            width: 100%;
            max-width: 600px;
            padding: 50px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            text-align: center;
            animation: fadeUp 1s ease-out;
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .logo { font-family: 'Cormorant Garamond', serif; font-size: 2rem; letter-spacing: 8px; color: var(--accent); margin-bottom: 10px; }
        .title { font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 300; margin-bottom: 20px; }
        .subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 40px; line-height: 1.6; }

        /* Форма */
        #contact-form { display: flex; flex-direction: column; gap: 15px; }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
        }

        .input-group textarea { resize: vertical; min-height: 120px; }

        .submit-btn {
            margin-top: 20px;
            padding: 18px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        #form-status { margin-top: 20px; font-size: 1rem; font-weight: 500; }

        /* Адаптив */
        @media (max-width: 600px) {
            .contact-wrapper { padding: 30px; margin: 20px; }
            .title { font-size: 2rem; }
            .cursor-dot, .cursor-outline { display: none; }
            * { cursor: auto; }
        }
    </style>
</head>
<body>

    <!-- Курсор -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Фон -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Форма -->
    <div class="contact-wrapper">
        <div class="logo">AURUM</div>
        <h1 class="title">Оставить заявку</h1>
        <p class="subtitle">Опишите вашу задачу, и я свяжусь с вами в ближайшее время.</p>

        <form id="contact-form">
            <div class="input-group">
                <input type="text" name="from_name" placeholder="Ваше имя" required>
            </div>
            <div class="input-group">
                <input type="email" name="from_email" placeholder="Ваш Email" required>
            </div>
            <div class="input-group">
                <textarea name="message" placeholder="Опишите вашу задачу..." required></textarea>
            </div>
            <button type="submit" id="submit-btn" class="submit-btn">Отправить заявку</button>
        </form>

        <p id="form-status"></p>
    </div>

    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        // Твои ключи из EmailJS
        const SERVICE_ID = "service_mockjof";
        const TEMPLATE_ID = "template_eepsoo9";
        const PUBLIC_KEY = "2qNoFrVLPDj0hQ48V";

        // Инициализация
        emailjs.init(PUBLIC_KEY);

        // Курсор (для красоты)
        const dot = document.querySelector('.cursor-dot');
        const outline = document.querySelector('.cursor-outline');
        
        document.addEventListener('mousemove', (e) => {
            const posX = e.clientX;
            const posY = e.clientY;
            dot.style.left = `${posX}px`;
            dot.style.top = `${posY}px`;
            outline.animate({ left: `${posX}px`, top: `${posY}px` }, { duration: 500, fill: "forwards" });
        });

        const hoverElements = document.querySelectorAll('input, textarea, button');
        hoverElements.forEach(el => {
            el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
            el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
        });

        // Обработка формы
        const form = document.getElementById('contact-form');
        const btn = document.getElementById('submit-btn');
        const status = document.getElementById('form-status');

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            
            btn.textContent = 'Отправка...';
            btn.disabled = true;

            const formData = {
                from_name: this.from_name.value,
                from_email: this.from_email.value,
                message: this.message.value
            };

            emailjs.send(SERVICE_ID, TEMPLATE_ID, formData)
                .then(function() {
                    status.textContent = '✅ Заявка отправлена! Я свяжусь с вами в ближайшее время.';
                    status.style.color = '#32cd32';
                    form.reset();
                    btn.textContent = 'Отправить заявку';
                    btn.disabled = false;
                }, function(error) {
                    status.textContent = '❌ Ошибка отправки. Попробуйте позже.';
                    status.style.color = '#ff2a75';
                    console.log('FAILED...', error);
                    btn.textContent = 'Отправить заявку';
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
